name: Docs guard (reusable)

# Enforces a repo's .docs-map.yml against the files a change touched, so documentation
# stays in step with code instead of relying on everyone remembering.
#
# Handles both ways work lands here:
#
#   pull_request — the original gate. Escape hatches are the `docs:skip` label and a
#                  `Wiki-PR:` trailer in the PR body.
#   push         — most commits go straight to the default branch and never open a PR, so
#                  the guard would never see them. It cannot block something already
#                  pushed; a red mark on the commit and a notification to its author are
#                  the nudge. Trailers come from the commit message instead, and a push
#                  that arrived via a merged PR is skipped so nothing is reported twice.
#
# The pre-push hook in hooks/ runs the same checker before the push, which is the last
# point it can still change what you do.
#
# Call it from a repo with:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, edited, labeled, unlabeled]
#     push:
#       branches: [master]
#
#   jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - run: echo probe-a
